<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Currency Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-raised: #f4f5f9;
    --hairline: rgba(18, 23, 43, 0.12);
    --ink: #12172b;
    --ink-dim: #6b7280;
    --gold: #9c6f14;
    --sage: #2f6b4c;
    --err: #b8352a;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body{
    padding: clamp(10px, 2vw, 16px);
    min-height: 100vh;
  }
  .board{
    max-width: 340px;
    width: 100%;
    padding: 0;
  }
  header{
    margin-bottom: 14px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(22px, 3.4vw, 27px);
    line-height: 1.15;
    margin: 0;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-color: var(--hairline);
  }

  .converter{
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .converter input{
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    padding: 4px 6px;
    width: 74px;
    flex: 0 0 auto;
  }
  .converter select{
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    padding: 4px 6px;
    flex: 0 1 auto;
    min-width: 0;
  }
  .converter input:focus, .converter select:focus{
    outline: none;
    border-color: var(--gold);
  }
  .gbp-ref{
    font-size: 10.5px;
    color: var(--ink-dim);
    margin: -8px 0 14px;
    font-variant-numeric: tabular-nums;
  }

  .meta-row{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    padding-top: 8px;
    padding-bottom: 3px;
    border-top: 1px solid var(--hairline);
  }
  .updated{
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 9.5px;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }
  .updated svg{ width: 9px; height: 9px; flex-shrink: 0; }
  .updated.stale{ color: var(--err); }
  button#refresh{
    display: flex;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: inherit;
    font-size: 9px;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button#refresh:hover{ border-color: var(--gold); color: var(--gold); }
  button#refresh:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  button#refresh svg{
    width: 8px; height: 8px;
    transition: transform 0.5s ease;
  }
  button#refresh.spinning svg{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  ul.rates{
    display: grid;
    grid-template-columns: max-content max-content;
    justify-content: start;
    column-gap: 10px;
    row-gap: 3px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.rate-row{ display: contents; }
  li.rate-row .names,
  li.rate-row .value{
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 5px;
  }
  li.rate-row:last-child .names,
  li.rate-row:last-child .value{
    border-bottom: none;
  }
  .names{
    min-width: 0;
    white-space: nowrap;
  }
  .curr-name{
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .value{
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .row-input{
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 16px;
    color: var(--gold);
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 0 0 1px;
    width: 82px;
    text-align: right;
    -moz-appearance: textfield;
  }
  .row-input::-webkit-outer-spin-button,
  .row-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
  .row-input:focus{ outline: none; border-bottom-color: var(--gold); }
  .value .unit{
    font-size: 10.5px;
    font-weight: 400;
    color: var(--ink-dim);
  }
  .value.unavailable{
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-dim);
    font-style: normal;
  }
  .value.unavailable a{ color: var(--sage); text-decoration: none; border-bottom: 1px dotted var(--sage); }

  .skeleton{
    display: inline-block;
    width: 70px;
    height: 15px;
    background: linear-gradient(90deg, var(--bg-raised) 0%, rgba(18,23,43,0.06) 50%, var(--bg-raised) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.2s ease infinite;
    border-radius: 2px;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
</style>
</head>
<body>
  <div class="board">
    <header>
      <h1>Currency Overview</h1>
    </header>

    <div class="converter">
      <input id="calcAmount" type="number" inputmode="decimal" min="0" step="any" value="1">
      <select id="baseCurrency">
        <option value="usd">USD</option>
        <option value="gbp">GBP</option>
      </select>
      <span>→</span>
    </div>
    <div class="gbp-ref" id="gbpRef">≈ — GBP</div>

    <div class="meta-row">
      <div class="updated" id="updated"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span id="updatedText">···</span></div>
      <button id="refresh" type="button" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Refresh
      </button>
    </div>

    <div id="content"></div>
  </div>

<script>
(function(){
  var CURRENCIES = [
    { name: "Rwandan Franc",     code: "RWF" },
    { name: "Tanzanian Shilling",code: "TZS" },
    { name: "Kenyan Shilling",   code: "KES" },
    { name: "Malawian Kwacha",   code: "MWK" },
    { name: "Mozambican Metical",code: "MZN" },
    { name: "Zimbabwean Dollar", code: "ZWG", altCode: "ZWL" },
    { name: "Zambian Kwacha",    code: "ZMW" },
    { name: "Botswana Pula",     code: "BWP" },
    { name: "Namibian Dollar",   code: "NAD" }
  ];
  var PRIMARY_URL = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json";
  var FALLBACK_URL = "https://latest.currency-api.pages.dev/v1/currencies/usd.json";
  var STORAGE_KEY = "usd-africa-rates-cache-v3";

  var contentEl = document.getElementById("content");
  var updatedEl = document.getElementById("updated");
  var updatedTextEl = document.getElementById("updatedText");
  var refreshBtn = document.getElementById("refresh");
  var calcAmountEl = document.getElementById("calcAmount");
  var baseCurrencyEl = document.getElementById("baseCurrency");
  var gbpRefEl = document.getElementById("gbpRef");

  var currentRates = null;
  var rowInputs = {};
  var usdAmount = 1; // canonical amount, expressed in USD, that every field derives its display from

  function rateFor(rates, code){
    var c = CURRENCIES.filter(function(x){ return x.code === code; })[0];
    if (!c || !rates) return null;
    var lc = c.code.toLowerCase();
    var altLc = c.altCode ? c.altCode.toLowerCase() : null;
    return rates[lc] != null ? rates[lc] : (altLc ? rates[altLc] : null);
  }

  function formatPlain(n){
    if (!isFinite(n)) return "";
    var decimals = n >= 100 ? 0 : (n >= 1 ? 2 : 4);
    return parseFloat(n.toFixed(decimals)).toString();
  }

  function readCache(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function writeCache(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){ /* storage unavailable, skip */ }
  }

  function timeAgo(ts){
    var diffMin = Math.round((Date.now() - ts) / 60000);
    if (diffMin < 1) return "now";
    if (diffMin < 60) return diffMin + "m";
    var diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + "h";
    var diffD = Math.round(diffH / 24);
    return diffD + "d";
  }

  function renderSkeleton(){
    var html = '<ul class="rates">';
    CURRENCIES.forEach(function(c){
      html += '<li class="rate-row"><div class="names"><span class="curr-name">' + c.name +
        '</span></div>' +
        '<div class="value"><span class="skeleton"></span></div></li>';
    });
    html += '</ul>';
    contentEl.innerHTML = html;
  }

  // Rebuilds the row DOM (called only when fresh rate data arrives, never on keystrokes).
  function buildRows(rates){
    rowInputs = {};
    var html = '<ul class="rates">';
    CURRENCIES.forEach(function(c){
      var raw = rateFor(rates, c.code);
      html += '<li class="rate-row"><div class="names"><span class="curr-name">' + c.name + '</span></div>';
      if (raw != null){
        html += '<div class="value"><input type="number" class="row-input" data-code="' + c.code + '" inputmode="decimal" step="any"><span class="unit">' + c.code + '</span></div>';
      } else {
        html += '<div class="value unavailable">n/a — check <a href="https://www.xe.com/currencyconverter/convert/?Amount=1&From=USD&To=' + c.code + '" target="_blank" rel="noopener">xe.com</a></div>';
      }
      html += '</li>';
    });
    html += '</ul>';
    contentEl.innerHTML = html;

    CURRENCIES.forEach(function(c){
      var el = contentEl.querySelector('input[data-code="' + c.code + '"]');
      if (!el) return;
      rowInputs[c.code] = el;
      el.addEventListener("input", function(){
        var val = parseFloat(el.value);
        if (isNaN(val)) return;
        var rate = rateFor(currentRates, c.code);
        if (rate == null) return;
        usdAmount = val / rate;
        redrawAll(el);
      });
    });
  }

  // Pushes the canonical usdAmount into every field except the one currently being edited.
  function redrawAll(skipEl){
    if (calcAmountEl !== skipEl){
      var base = baseCurrencyEl.value;
      var gbpRate = currentRates ? currentRates["gbp"] : null;
      var topVal = (base === "gbp" && gbpRate != null) ? usdAmount * gbpRate : usdAmount;
      calcAmountEl.value = formatPlain(topVal);
    }
    CURRENCIES.forEach(function(c){
      var inp = rowInputs[c.code];
      if (!inp || inp === skipEl) return;
      var rate = rateFor(currentRates, c.code);
      if (rate == null) return;
      inp.value = formatPlain(usdAmount * rate);
    });

    if (gbpRefEl){
      var gbpRate = currentRates ? currentRates["gbp"] : null;
      gbpRefEl.textContent = (gbpRate != null) ? "≈ " + formatPlain(usdAmount * gbpRate) + " GBP" : "≈ — GBP";
    }
  }

  function renderRates(rates, asOfTs, isCached){
    currentRates = rates;
    buildRows(rates);
    redrawAll(null);

    if (updatedTextEl){
      updatedTextEl.textContent = timeAgo(asOfTs);
      updatedEl.classList.toggle("stale", !!isCached);
    }
  }

  calcAmountEl.addEventListener("input", function(){
    var val = parseFloat(calcAmountEl.value);
    if (isNaN(val)) return;
    var base = baseCurrencyEl.value;
    var gbpRate = currentRates ? currentRates["gbp"] : null;
    usdAmount = (base === "gbp" && gbpRate != null) ? val / gbpRate : val;
    redrawAll(calcAmountEl);
  });

  baseCurrencyEl.addEventListener("change", function(){
    redrawAll(null);
  });

  function renderError(){
    contentEl.innerHTML = '<div style="color:var(--ink-dim); font-size:12px; margin-top:6px;">Could not reach the rates service right now. Try refresh, or check your connection.</div>';
    if (updatedTextEl){
      updatedTextEl.textContent = "—";
      updatedEl.classList.add("stale");
    }
  }

  function fetchFrom(url){
    return fetch(url).then(function(res){
      if (!res.ok) throw new Error("bad response");
      return res.json();
    });
  }

  function fetchRates(isManual){
    if (isManual) refreshBtn.classList.add("spinning");
    fetchFrom(PRIMARY_URL)
      .catch(function(){ return fetchFrom(FALLBACK_URL); })
      .then(function(data){
        var rates = data && data.usd;
        if (!rates) throw new Error("no rates");
        var now = Date.now();
        writeCache({ rates: rates, ts: now });
        renderRates(rates, now, false);
      })
      .catch(function(){
        var cached = readCache();
        if (cached){
          renderRates(cached.rates, cached.ts, true);
        } else {
          renderError();
        }
      })
      .finally(function(){
        if (isManual) refreshBtn.classList.remove("spinning");
      });
  }

  refreshBtn.addEventListener("click", function(){ fetchRates(true); });

  var cached = readCache();
  if (cached){
    renderRates(cached.rates, cached.ts, true);
  } else {
    renderSkeleton();
  }
  fetchRates(false);
})();
</script>
</body>
</html>
