<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick Currency Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-raised: #f4f5f9;
    --hairline: rgba(18, 23, 43, 0.12);
    --ink: #12172b;
    --ink-dim: #6b7280;
    --gold: #9c6f14;
    --sage: #2f6b4c;
    --err: #b8352a;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body{
    padding: clamp(14px, 3vw, 24px);
    min-height: 100vh;
    display: flex;
  }
  .board{
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(12px, 3vw, 18px);
  }
  header{
    margin-bottom: 12px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(18px, 3vw, 22px);
    line-height: 1.15;
    margin: 0;
    color: var(--ink);
  }

  .converter{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .converter input{
    font-family: inherit;
    font-size: 11.5px;
    color: var(--ink);
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    padding: 3px 5px;
    width: 44px;
    flex: 0 0 auto;
  }
  .converter input:focus{
    outline: none;
    border-color: var(--gold);
  }

  .meta-row{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding-top: 8px;
    padding-bottom: 3px;
    border-top: 1px solid var(--hairline);
  }
  .updated{
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 8px;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }
  .updated svg{ width: 8px; height: 8px; flex-shrink: 0; }
  .updated.stale{ color: var(--err); }
  button#refresh{
    display: flex;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: inherit;
    font-size: 7.5px;
    padding: 2px 5px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button#refresh:hover{ border-color: var(--gold); color: var(--gold); }
  button#refresh:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  button#refresh svg{
    width: 7px; height: 7px;
    transition: transform 0.5s ease;
  }
  button#refresh.spinning svg{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  ul.rates{
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.rate-row{
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: baseline;
    column-gap: 6px;
    padding: 5px 0;
    border-bottom: 1px solid var(--hairline);
  }
  li.rate-row:last-child{ border-bottom: none; }
  .names{
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .curr-name{
    font-size: 11.5px;
    color: var(--ink);
  }
  .leader{
    border-bottom: 1px dotted var(--hairline);
    margin-bottom: 3px;
    height: 0;
    min-width: 12px;
  }
  .value{
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    column-gap: 4px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--gold);
    width: 118px;
    justify-self: end;
  }
  .value .num{
    text-align: right;
    white-space: nowrap;
  }
  .value .unit{
    font-size: 9px;
    font-weight: 400;
    color: var(--ink-dim);
    text-align: left;
    white-space: nowrap;
  }
  .value.unavailable{
    display: block;
    width: auto;
    max-width: 180px;
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-dim);
    font-style: normal;
  }
  .value.unavailable a{ color: var(--sage); text-decoration: none; border-bottom: 1px dotted var(--sage); }

  .skeleton{
    display: inline-block;
    grid-column: 1 / -1;
    width: 70px;
    height: 14px;
    background: linear-gradient(90deg, var(--bg-raised) 0%, rgba(18,23,43,0.06) 50%, var(--bg-raised) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.2s ease infinite;
    border-radius: 2px;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

  @media (max-width: 420px){
    .value{ width: 98px; }
  }
</style>
</head>
<body>
  <div class="board">
    <header>
      <h1>Quick currency overview</h1>
    </header>

    <div class="converter">
      <input id="calcAmount" type="number" inputmode="decimal" min="0" step="any" value="1">
      <span>USD →</span>
    </div>

    <div class="meta-row">
      <div class="updated" id="updated"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span id="updatedText">···</span></div>
      <button id="refresh" type="button" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Refresh
      </button>
    </div>

    <div id="content"></div>
  </div>

<script>
(function(){
  var CURRENCIES = [
    { name: "Rwandan Franc",     code: "RWF" },
    { name: "Tanzanian Shilling",code: "TZS" },
    { name: "Kenyan Shilling",   code: "KES" },
    { name: "Malawian Kwacha",   code: "MWK" },
    { name: "Mozambican Metical",code: "MZN" },
    { name: "Zimbabwean Dollar", code: "ZWG", altCode: "ZWL" },
    { name: "Zambian Kwacha",    code: "ZMW" },
    { name: "Botswana Pula",     code: "BWP" },
    { name: "Namibian Dollar",   code: "NAD" }
  ];
  var PRIMARY_URL = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json";
  var FALLBACK_URL = "https://latest.currency-api.pages.dev/v1/currencies/usd.json";
  var STORAGE_KEY = "usd-africa-rates-cache-v3";

  var contentEl = document.getElementById("content");
  var updatedEl = document.getElementById("updated");
  var updatedTextEl = document.getElementById("updatedText");
  var refreshBtn = document.getElementById("refresh");
  var calcAmountEl = document.getElementById("calcAmount");

  var currentRates = null;
  var currentTs = null;
  var currentIsCached = false;

  function fmtNumber(n){
    if (n >= 100) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (n >= 1) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
    return n.toLocaleString(undefined, { maximumFractionDigits: 4 });
  }

  function readCache(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function writeCache(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){ /* storage unavailable, skip */ }
  }

  function timeAgo(ts){
    var diffMin = Math.round((Date.now() - ts) / 60000);
    if (diffMin < 1) return "now";
    if (diffMin < 60) return diffMin + "m";
    var diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + "h";
    var diffD = Math.round(diffH / 24);
    return diffD + "d";
  }

  function renderSkeleton(){
    var html = '<ul class="rates">';
    CURRENCIES.forEach(function(c){
      html += '<li class="rate-row"><div class="names"><span class="curr-name">' + c.name +
        '</span></div><div class="leader"></div>' +
        '<div class="value"><span class="skeleton"></span></div></li>';
    });
    html += '</ul>';
    contentEl.innerHTML = html;
  }

  function currentAmount(){
    var amount = parseFloat(calcAmountEl.value);
    return isNaN(amount) ? 1 : amount;
  }

  function renderRates(rates, asOfTs, isCached){
    currentRates = rates;
    currentTs = asOfTs;
    currentIsCached = isCached;

    var amount = currentAmount();
    var html = '<ul class="rates">';
    CURRENCIES.forEach(function(c){
      var lc = c.code.toLowerCase();
      var altLc = c.altCode ? c.altCode.toLowerCase() : null;
      var raw = rates[lc] != null ? rates[lc] : (altLc ? rates[altLc] : null);
      html += '<li class="rate-row"><div class="names"><span class="curr-name">' + c.name + '</span></div><div class="leader"></div>';
      if (raw != null){
        html += '<div class="value"><span class="num">' + fmtNumber(raw * amount) + '</span><span class="unit">' + c.code + '</span></div>';
      } else {
        html += '<div class="value unavailable">n/a — check <a href="https://www.xe.com/currencyconverter/convert/?Amount=1&From=USD&To=' + c.code + '" target="_blank" rel="noopener">xe.com</a></div>';
      }
      html += '</li>';
    });
    html += '</ul>';
    contentEl.innerHTML = html;

    if (updatedTextEl){
      updatedTextEl.textContent = timeAgo(asOfTs);
      updatedEl.classList.toggle("stale", !!isCached);
    }
  }

  calcAmountEl.addEventListener("input", function(){
    if (currentRates) renderRates(currentRates, currentTs, currentIsCached);
  });

  function renderError(){
    contentEl.innerHTML = '<div style="color:var(--ink-dim); font-size:11px; margin-top:6px;">Could not reach the rates service right now. Try refresh, or check your connection.</div>';
    if (updatedTextEl){
      updatedTextEl.textContent = "—";
      updatedEl.classList.add("stale");
    }
  }

  function fetchFrom(url){
    return fetch(url).then(function(res){
      if (!res.ok) throw new Error("bad response");
      return res.json();
    });
  }

  function fetchRates(isManual){
    if (isManual) refreshBtn.classList.add("spinning");
    fetchFrom(PRIMARY_URL)
      .catch(function(){ return fetchFrom(FALLBACK_URL); })
      .then(function(data){
        var rates = data && data.usd;
        if (!rates) throw new Error("no rates");
        var now = Date.now();
        writeCache({ rates: rates, ts: now });
        renderRates(rates, now, false);
      })
      .catch(function(){
        var cached = readCache();
        if (cached){
          renderRates(cached.rates, cached.ts, true);
        } else {
          renderError();
        }
      })
      .finally(function(){
        if (isManual) refreshBtn.classList.remove("spinning");
      });
  }

  refreshBtn.addEventListener("click", function(){ fetchRates(true); });

  var cached = readCache();
  if (cached){
    renderRates(cached.rates, cached.ts, true);
  } else {
    renderSkeleton();
  }
  fetchRates(false);
})();
</script>
</body>
</html>
